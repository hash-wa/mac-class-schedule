name: Rebuild index from existing data

# Run this manually if the web app shows fewer terms than data/*.json actually
# contains on disk - it happens if a scrape/backfill run was interrupted
# before it could update index.json. This does NOT scrape anything; it just
# regenerates index.json by reading whatever term files already exist.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch pages.yml after pushing new data

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild index.json
        working-directory: scraper
        run: python rebuild_index.py

      - name: Commit data
        id: commit
        run: |
          git config user.name "rebuild-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/index.json
          if git diff --cached --quiet; then
            echo "No changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Rebuild index.json from existing data files"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        # Bot pushes with the default GITHUB_TOKEN don't fire pages.yml
        # (GitHub's recursion guard), so dispatch it explicitly.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
